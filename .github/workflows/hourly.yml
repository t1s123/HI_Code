name: Hourly Python Script

on:
  workflow_dispatch:      # allows manual runs
  schedule:
    - cron: "0 * * * *"
    
jobs:
  run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    # Try to restore previously saved info.txt
    - name: Restore info.txt (ignore if missing)
      uses: actions/download-artifact@v4
      with:
        name: info
        path: .
      continue-on-error: true

    # If no artifact existed, use repo version or create new
    - name: Ensure info.txt exists
      run: |
        if [ ! -f info.txt ]; then
          echo "info.txt missing — creating blank file."
          touch info.txt
        fi

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # Create service_account.json from encrypted secret
    - name: Create service_account.json
      run: |
        echo "$SERVICEACCOUNTJSON" > service_account.json
      env:
        SERVICEACCOUNTJSON: ${{ secrets.SERVICEACCOUNTJSON }}

    # Run your script
    - name: Run smsSchedule.py
      env:
        KEY: ${{ secrets.KEY }}
        TEXTBEEKEY: ${{ secrets.TEXTBEEKEY }}
        SERVICEACCOUNTJSON: ${{ secrets.SERVICEACCOUNTJSON }}
      run: python smsSchedule.py

    # Save updated info.txt artifact for next run
    - name: Save updated info.txt
      uses: actions/upload-artifact@v4
      with:
        name: info
        path: info.txt
        retention-days: 90
