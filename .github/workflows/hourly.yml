name: Hourly Python Script

on:
  schedule:
    - cron: "0 * * * *"  # Run every hour at minute 0

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Restore info.txt
      uses: actions/download-artifact@v4
      with:
        name: info
        path: .
      continue-on-error: true

    - name: Create info.txt if missing
      run: |
        if [ ! -f info.txt ]; then
          echo "info.txt missing — creating blank file."
          touch info.txt
        fi

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Create service_account.json
      run: |
        echo "$SERVICEACCOUNTJSON" > service_account.json

    - name: Run smsSchedule.py
      env:
        KEY: ${{ secrets.KEY }}
        TEXTBEEKEY: ${{ secrets.TEXTBEEKEY }}
        SERVICEACCOUNTJSON: ${{ secrets.SERVICEACCOUNTJSON }}
      run: python smsSchedule.py

    - name: Save info.txt
      uses: actions/upload-artifact@v4
      with:
        name: info
        path: info.txt
        retention-days: 90
