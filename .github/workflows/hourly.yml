name: Hourly Python Script

on:
  workflow_dispatch:
  schedule:
    - cron: "45 * * * *"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: download info
        run: |
          set -e
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/persistent-info || true)

          if echo "$RESPONSE" | grep -q '"Not Found"'; then
            echo "Release not found — creating blank info.txt"
            touch info.txt
          else
            ASSET_URL=$(echo "$RESPONSE" | jq -r '.assets[] | select(.name=="info.txt") | .url')
            if [ -n "$ASSET_URL" ]; then
              echo "Downloading previous info.txt..."
              curl -L -H "Accept: application/octet-stream" \
                   -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                   -o info.txt "$ASSET_URL"
            else
              echo "info.txt not found in release — creating blank file."
              touch info.txt
            fi
          fi

      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: decode account
        run: |
          echo "${{ secrets.SERVICE_JSON_B64 }}" | base64 --decode > service_account.json

      - name: run script
        env:
          TEXTBEEKEY: ${{ secrets.TEXTBEEKEY }}
          SERVICEACCOUNTJSON: ${{ secrets.SERVICEACCOUNTJSON }}
        run: python smsSchedule.py

      - name: upload info
        uses: softprops/action-gh-release@v1
        with:
          tag_name: persistent-info
          name: persistent-info
          draft: true
          files: info.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
